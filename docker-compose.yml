version: '3.8'

services:
  # FastAPI + SQLModel + Strawberry GraphQL Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnispace-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # SQLite by default:
      - DATABASE_URL=sqlite:///./omnispace.db
      # For PostgreSQL, uncomment below and comment SQLite line:
      # - DATABASE_URL=postgresql://omnispace:secretpassword@postgres:5432/omnispace
      - JWT_SECRET=production-secret-omnispace-key-928473
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/omnispace.db:/app/omnispace.db
    # depends_on:
    #   - postgres

  # Optional PostgreSQL database service (easy drop-in replacement for SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: omnispace-postgres
  #   environment:
  #     POSTGRES_USER: omnispace
  #     POSTGRES_PASSWORD: secretpassword
  #     POSTGRES_DB: omnispace
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # Frontend Web UI (React + TypeScript + Vite + Tailwind CSS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnispace-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

